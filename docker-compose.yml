services:
  backend:
    build:
      context: ./backend/virtualCampus
    env_file:
      - .env
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - .env
    ports:
      - "8000:8000"

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_campus}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
